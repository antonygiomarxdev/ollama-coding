version: '3.8'
services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-qwen3
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  ngrok:
    image: ngrok/ngrok:latest
    container_name: ngrok-ollama
    depends_on:
      - ollama
    command:
      - "http"
      - "--url"
      - "your-subdomain.ngrok-free.app"
      - "ollama:11434"
    environment:
      - NGROK_AUTHTOKEN=TU_TOKEN_AQUI
    restart: unless-stopped

volumes:
  ollama:
